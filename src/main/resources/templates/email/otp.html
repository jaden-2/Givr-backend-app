<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Email Verification</title>
</head>
<body style="background:#f4f6f8;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">
            <table width="480" style="background:#ffffff;border-radius:8px;padding:24px;">
                <tr>
                    <td style="text-align:center;">
                        <h2>Email Verification</h2>
                        <p>Use the code below to continue:</p>

                        <div style="font-size:32px;letter-spacing:6px;font-weight:bold;">
                            <span th:text="${otp}"></span>
                        </div>

                        <p>This code expires in <strong th:text="${expiryMinutes}"></strong> minutes.</p>

                        <p>If you didn’t request this, ignore this email.</p>

                        <p>
                            Thanks,<br/>
                            <strong th:text="${appName}"></strong>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
